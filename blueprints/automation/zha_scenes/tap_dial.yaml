blueprint:
  name: Hue Tap Dial for ZHA Scenes
  description: >-
    Each of the four buttons of a Hue Tap Dial paired to ZHA starts a ZHA Scenes scene (a standard,
    saved or dynamic scene) with its own brightness. Bind the dial to the zone's ZHA group so dimming and off work without Home
    Assistant.
  domain: automation
  source_url: https://github.com/marcelveldt/zha-scenes/blob/main/blueprints/automation/zha_scenes/tap_dial.yaml
  homeassistant:
    min_version: 2026.11.0
  input:
    tap_dial:
      name: Tap Dial
      selector:
        device:
          filter:
            - integration: zha
              model: RDM002
    button_1_scene:
      name: Button 1 scene
      selector:
        entity:
          filter:
            - integration: zha_scenes
              domain: scene
    button_1_brightness:
      name: Button 1 brightness
      description: 0 keeps the scene's own brightness.
      default: 0
      selector:
        number:
          min: 0
          max: 255
          mode: slider
    button_2_scene:
      name: Button 2 scene
      selector:
        entity:
          filter:
            - integration: zha_scenes
              domain: scene
    button_2_brightness:
      name: Button 2 brightness
      description: 0 keeps the scene's own brightness.
      default: 0
      selector:
        number:
          min: 0
          max: 255
          mode: slider
    button_3_scene:
      name: Button 3 scene
      selector:
        entity:
          filter:
            - integration: zha_scenes
              domain: scene
    button_3_brightness:
      name: Button 3 brightness
      description: 0 keeps the scene's own brightness.
      default: 0
      selector:
        number:
          min: 0
          max: 255
          mode: slider
    button_4_scene:
      name: Button 4 scene
      selector:
        entity:
          filter:
            - integration: zha_scenes
              domain: scene
    button_4_brightness:
      name: Button 4 brightness
      description: 0 keeps the scene's own brightness.
      default: 0
      selector:
        number:
          min: 0
          max: 255
          mode: slider
    transition:
      name: Transition
      description: Fade time when a button starts a scene; empty keeps the default.
      default:
      selector:
        number:
          min: 0
          max: 6553
          step: 0.1
          unit_of_measurement: seconds
          mode: box

# a press waits for the previous start, so the last press decides the scene
mode: queued
max: 10
max_exceeded: silent

triggers:
  # the quirk reports quick repeated taps as one multi-press event instead of short presses
  - trigger: device
    domain: zha
    device_id: !input tap_dial
    type: remote_button_short_press
    subtype: button_1
    id: button_1
    variables:
      scene: !input button_1_scene
      brightness: !input button_1_brightness
  - trigger: device
    domain: zha
    device_id: !input tap_dial
    type: remote_button_double_press
    subtype: button_1
    id: button_1
    variables:
      scene: !input button_1_scene
      brightness: !input button_1_brightness
  - trigger: device
    domain: zha
    device_id: !input tap_dial
    type: remote_button_short_press
    subtype: button_2
    id: button_2
    variables:
      scene: !input button_2_scene
      brightness: !input button_2_brightness
  - trigger: device
    domain: zha
    device_id: !input tap_dial
    type: remote_button_double_press
    subtype: button_2
    id: button_2
    variables:
      scene: !input button_2_scene
      brightness: !input button_2_brightness
  - trigger: device
    domain: zha
    device_id: !input tap_dial
    type: remote_button_short_press
    subtype: button_3
    id: button_3
    variables:
      scene: !input button_3_scene
      brightness: !input button_3_brightness
  - trigger: device
    domain: zha
    device_id: !input tap_dial
    type: remote_button_double_press
    subtype: button_3
    id: button_3
    variables:
      scene: !input button_3_scene
      brightness: !input button_3_brightness
  - trigger: device
    domain: zha
    device_id: !input tap_dial
    type: remote_button_short_press
    subtype: button_4
    id: button_4
    variables:
      scene: !input button_4_scene
      brightness: !input button_4_brightness
  - trigger: device
    domain: zha
    device_id: !input tap_dial
    type: remote_button_double_press
    subtype: button_4
    id: button_4
    variables:
      scene: !input button_4_scene
      brightness: !input button_4_brightness

variables:
  transition: !input transition

actions:
  - action: zha_scenes.activate
    target:
      entity_id: "{{ scene }}"
    data: >-
      {% set data = {'brightness': brightness} if brightness > 0 else {} %}
      {{ dict(data, transition=transition) if transition is not none else data }}
