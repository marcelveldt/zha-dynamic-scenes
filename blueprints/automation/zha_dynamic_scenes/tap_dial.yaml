blueprint:
  name: Hue Tap Dial dynamic scenes
  description: >-
    Buttons 1 to 3 of a Hue Tap Dial paired to ZHA each start a palette of ZHA dynamic scenes
    with their own brightness; button 4 steps to the zone's next palette. Bind the dial to the
    zone's ZHA group so dimming and off work without Home Assistant.
  domain: automation
  source_url: https://github.com/marcelveldt/zha-dynamic-scenes/blob/main/blueprints/automation/zha_dynamic_scenes/tap_dial.yaml
  homeassistant:
    min_version: 2026.11.0
  input:
    tap_dial:
      name: Tap Dial
      selector:
        device:
          filter:
            - integration: zha
              model: RDM002
    zone:
      name: Zone
      description: The zone's palette select; button 4 starts its next palette.
      selector:
        entity:
          filter:
            - integration: zha_dynamic_scenes
              domain: select
    button_1_scene:
      name: Button 1 palette
      selector:
        entity:
          filter:
            - integration: zha_dynamic_scenes
              domain: scene
    button_1_brightness:
      name: Button 1 brightness
      description: 0 keeps the palette's own brightness.
      default: 0
      selector:
        number:
          min: 0
          max: 255
          mode: slider
    button_2_scene:
      name: Button 2 palette
      selector:
        entity:
          filter:
            - integration: zha_dynamic_scenes
              domain: scene
    button_2_brightness:
      name: Button 2 brightness
      description: 0 keeps the palette's own brightness.
      default: 0
      selector:
        number:
          min: 0
          max: 255
          mode: slider
    button_3_scene:
      name: Button 3 palette
      selector:
        entity:
          filter:
            - integration: zha_dynamic_scenes
              domain: scene
    button_3_brightness:
      name: Button 3 brightness
      description: 0 keeps the palette's own brightness.
      default: 0
      selector:
        number:
          min: 0
          max: 255
          mode: slider
    transition:
      name: Transition
      description: Fade time when buttons 1 to 3 start a palette; empty keeps the default.
      default:
      selector:
        number:
          min: 0
          max: 6553
          step: 0.1
          unit_of_measurement: seconds
          mode: box

# a press waits for the previous start, so button 4 steps on from the palette it started
mode: queued
max: 10
max_exceeded: silent

triggers:
  - trigger: device
    domain: zha
    device_id: !input tap_dial
    type: remote_button_short_press
    subtype: button_1
    id: button_1
    variables:
      scene: !input button_1_scene
      brightness: !input button_1_brightness
  - trigger: device
    domain: zha
    device_id: !input tap_dial
    type: remote_button_short_press
    subtype: button_2
    id: button_2
    variables:
      scene: !input button_2_scene
      brightness: !input button_2_brightness
  - trigger: device
    domain: zha
    device_id: !input tap_dial
    type: remote_button_short_press
    subtype: button_3
    id: button_3
    variables:
      scene: !input button_3_scene
      brightness: !input button_3_brightness
  - trigger: device
    domain: zha
    device_id: !input tap_dial
    type: remote_button_short_press
    subtype: button_4
    id: button_4

variables:
  transition: !input transition

actions:
  - if:
      - condition: trigger
        id: button_4
    then:
      - action: select.select_next
        target:
          entity_id: !input zone
        data:
          cycle: true
    else:
      - action: zha_dynamic_scenes.activate
        target:
          entity_id: "{{ scene }}"
        data: >-
          {% set data = {'brightness': brightness} if brightness > 0 else {} %}
          {{ dict(data, transition=transition) if transition is not none else data }}
