activate:
  target:
    entity:
      integration: zha_scenes
      domain: scene
  fields:
    speed:
      selector:
        number:
          min: 0
          max: 1
          step: 0.01
          mode: slider
    brightness:
      selector:
        number:
          min: 1
          max: 255
          mode: slider
    transition:
      selector:
        number:
          min: 0
          max: 6553
          step: 0.1
          unit_of_measurement: seconds
          mode: box

rewrite_scenes:
  target:
    entity:
      integration: zha_scenes
      domain: select
