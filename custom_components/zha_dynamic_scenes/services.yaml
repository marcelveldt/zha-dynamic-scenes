activate:
  target:
    entity:
      integration: zha_dynamic_scenes
      domain: select
  fields:
    palette:
      required: true
      example: "Blossom"
      selector:
        text:
    speed:
      selector:
        number:
          min: 0
          max: 1
          step: 0.01
          mode: slider
    brightness:
      selector:
        number:
          min: 1
          max: 255
          mode: slider
    transition:
      selector:
        number:
          min: 0
          max: 300
          step: 0.1
          unit_of_measurement: seconds

rewrite_scenes:
  target:
    entity:
      integration: zha_dynamic_scenes
      domain: select
